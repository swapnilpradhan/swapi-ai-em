<mat-card>
  <mat-card-title>Library</mat-card-title>
  <mat-card-subtitle>Previously generated HTML explainers stored in PostgreSQL</mat-card-subtitle>

  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px">
    <mat-form-field appearance="outline" style="min-width:320px;flex:1">
      <mat-label>Filter by topic</mat-label>
      <input matInput [(ngModel)]="topicFilter" (keyup.enter)="refresh()" placeholder="search…" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="refresh()">Refresh</button>
  </div>

  <div style="margin-top:12px;overflow:auto">
    <table mat-table [dataSource]="rows" class="mat-elevation-z1" style="min-width:900px">
      <ng-container matColumnDef="topic">
        <th mat-header-cell *matHeaderCellDef>Topic</th>
        <td mat-cell *matCellDef="let r">{{ r.topic }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">{{ r.status }}</td>
      </ng-container>

      <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let r">{{ fmt.ms(r.total_duration_ms) }}</td>
      </ng-container>

      <ng-container matColumnDef="created">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let r">{{ r.created_at | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let r">
          <a mat-button color="primary" [routerLink]="['/library', r.id]">Preview</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
</mat-card>
